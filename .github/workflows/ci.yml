name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Node dependencies (docx, Puppeteer + Chrome)
        run: npm ci

      - name: Install MarkItDown
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt

      - name: Run tests (build, truth check, ATS parse check, negative tests)
        run: npm test

      - name: Upload example resume
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: example-resume
          path: examples/jane-doe/
