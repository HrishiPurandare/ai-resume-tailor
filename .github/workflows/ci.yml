name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install Node dependencies (docx, Puppeteer + Chrome)
        run: npm ci

      - name: Install MarkItDown with every extra (same command users run)
        run: npm run setup:py:extras

      - name: Run tests (build, truth check, ATS check, every import format, MCP server)
        run: npm test

      - name: Upload example resume
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: example-resume-${{ matrix.os }}
          path: examples/jane-doe/
